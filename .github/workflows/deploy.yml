name: "Terraform Deploy LocalStack"

on:
  push:
    branches:
      - main

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Levantar LocalStack
        run: |
          docker compose up -d
          echo "Esperando a que LocalStack esté listo..."
          sleep 20 # Tiempo para que el servicio S3 arranque

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.0.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
